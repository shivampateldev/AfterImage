name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Dist
        run: pnpm build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate and Rename APK
        run: |
          mkdir -p release-artifacts
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} release-artifacts/AFTERIMAGE-release.apk \;
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AFTERIMAGE: THE LAST ECHO ${{ github.ref_name }} (Production Release)"
          body: |
            ## AFTERIMAGE: THE LAST ECHO
            Official Android production release.
            
            - **Package:** `com.smp.afterimage`
            - **Platform:** Android
            - **Publisher:** SMP Original
          files: release-artifacts/AFTERIMAGE-release.apk
